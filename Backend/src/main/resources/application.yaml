spring:
  application:
    name: BaoEng
  datasource:
    url: jdbc:mysql://localhost:3307/baoeng?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-dev-only-change-me}
  access-token-ttl: 10800 # 3 giờ
  refresh-token-ttl: 604800 # 7 ngày
  cookie-secure: false # true khi chạy HTTPS (production)

app:
  progress:
    # Muc tieu phut hoc moi ngay (hien thi o khoi "Tien do hom nay").
    daily-goal-minutes: "${DAILY_GOAL_MINUTES:15}"
    # Muc tieu phut luyen tap moi tuan (khoi "Thu thach thoi gian luyen tap tuan nay").
    weekly-goal-minutes: "${WEEKLY_GOAL_MINUTES:90}"
  cors:
    # Origin của client web được phép gọi API (nhiều giá trị cách nhau bằng dấu phẩy).
    # 5173 = Vite, 3000 = CRA/Next, 8081 = Expo Web (Metro).
    # Production: chỉ khai báo domain thật, ví dụ CORS_ALLOWED_ORIGINS=https://baoeng.vn
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081}"
    # Pattern hỗ trợ wildcard CỔNG dạng [*] — tiện khi cổng dev thay đổi.
    # Production: để trống và chỉ dùng allowed-origins.
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}"
    # Thời gian cache kết quả preflight (giây).
    max-age-seconds: 3600
